name: Nightly Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-release
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    name: Build signed nightly APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'ndk;30.0.16248370'

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20261011034528-197770444867
          go_bin="$(go env GOPATH)/bin"
          echo "$go_bin" >> "$GITHUB_PATH"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
          export PATH="$go_bin:$PATH"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/30.0.16248370"
          GOTOOLCHAIN=local gomobile init

      - name: Build Go package and Android library
        working-directory: go
        run: |
          GOTOOLCHAIN=local go build ./...
          GOTOOLCHAIN=local gomobile bind \
            -v \
            -target=android/arm64 \
            -androidapi 24 \
            -ldflags="-s -w" \
            -o ../app/libs/engine.aar \
            .

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEYSTORE_BASE64:-}" ]]; then
            echo "::error::Add the ANDROID_KEYSTORE_BASE64 Actions secret before building a signed nightly."
            exit 1
          fi
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/whatsgo-release.jks"
          test -s "$RUNNER_TEMP/whatsgo-release.jks"

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/whatsgo-release.jks
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_STORE_PASSWORD:-}" || -z "${ANDROID_KEY_ALIAS:-}" || -z "${ANDROID_KEY_PASSWORD:-}" ]]; then
            echo "::error::Add ANDROID_STORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD Actions secrets."
            exit 1
          fi
          ./gradlew --no-daemon --no-configuration-cache assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/WhatsGo-nightly.apk"

      - name: Verify APK signature matches the latest published APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -n "$apksigner" || { echo "Android apksigner was not found" >&2; exit 1; }

          stable_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '[.[] | select(.draft == false and .tag_name != "nightly" and any(.assets[]; .name == "WhatGo.apk"))] | sort_by(.created_at) | last | .tag_name // empty')"
          if [[ -z "$stable_tag" ]]; then
            echo "No published WhatGo.apk was found to check the signing certificate against." >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/stable-release"
          gh release download "$stable_tag" \
            --pattern WhatGo.apk \
            --dir "$RUNNER_TEMP/stable-release"

          certificate_digest() {
            "$apksigner" verify --print-certs "$1" |
              sed -nE 's/^Signer #[0-9]+ certificate SHA-256 digest: ([[:xdigit:]:]+)$/\1/p' |
              tr -d ':' |
              tr '[:upper:]' '[:lower:]' |
              sort
          }
          nightly_digest="$(certificate_digest "$RUNNER_TEMP/WhatsGo-nightly.apk")"
          stable_digest="$(certificate_digest "$RUNNER_TEMP/stable-release/WhatGo.apk")"
          if [[ -z "$nightly_digest" || "$nightly_digest" != "$stable_digest" ]]; then
            echo "The nightly APK certificate does not match the latest published APK; refusing to publish it." >&2
            exit 1
          fi

      - name: Upload signed APK for the publish job
        uses: actions/upload-artifact@v6
        with:
          name: signed-nightly-apk
          path: ${{ runner.temp }}/WhatsGo-nightly.apk
          if-no-files-found: error
          retention-days: 1

      - name: Remove temporary signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/whatsgo-release.jks"

  publish:
    if: github.ref == 'refs/heads/main'
    needs: build
    name: Update nightly prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download signed APK
        uses: actions/download-artifact@v8
        with:
          name: signed-nightly-apk
          path: ${{ runner.temp }}

      - name: Prepare nightly release notes
        run: |
          cat > "$RUNNER_TEMP/nightly-notes.md" <<EOF
          Automated WhatsGo testing build from the latest commit on main.

          - Commit: $GITHUB_SHA
          - Built: $(date -u +'%Y-%m-%d %H:%M UTC')
          EOF

      - name: Move nightly tag to this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ref_endpoint="repos/${GITHUB_REPOSITORY}/git/ref/tags/nightly"
          if gh api "$ref_endpoint" >/dev/null 2>&1; then
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/nightly" \
              -f sha="$GITHUB_SHA" \
              -F force=true >/dev/null
          else
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/nightly" \
              -f sha="$GITHUB_SHA" >/dev/null
          fi

      - name: Create or update the nightly prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view nightly >/dev/null 2>&1; then
            gh release edit nightly \
              --title "WhatsGo Nightly" \
              --notes-file "$RUNNER_TEMP/nightly-notes.md" \
              --prerelease \
              --latest=false
          else
            gh release create nightly \
              --title "WhatsGo Nightly" \
              --notes-file "$RUNNER_TEMP/nightly-notes.md" \
              --prerelease \
              --latest=false \
              --verify-tag
          fi

      - name: Replace the nightly APK asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload nightly \
            "$RUNNER_TEMP/WhatsGo-nightly.apk" \
            --clobber
